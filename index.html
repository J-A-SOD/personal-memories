<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Personal Memories</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-config.css">
</head>

<body>

    <div class="backdrop" aria-hidden="true">
        <span class="backdrop-year" id="backdropYear">—</span>
    </div>

    <main class="focus" id="focus" aria-live="polite">
        <p class="focus-date" id="focusDate"></p>
        <h1 class="focus-title" id="focusTitle"></h1>
    </main>

    <p class="hint" id="hint">Scroll, drag, or use the arrow keys to move through time</p>

    <nav class="timeline" aria-label="Memory timeline" id="timeline">
        <div class="playhead" aria-hidden="true"></div>
        <div class="timeline-viewport" id="viewport">
            <div class="timeline-ticks" id="ticks"></div>
            <div class="timeline-track" id="track">
                <div class="timeline-line" id="line"></div>
        </div>
        </div>
    </nav>

  <script src="script.js"></script>
</body>

</html>
